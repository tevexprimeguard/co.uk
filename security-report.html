<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Report – Tevex Prime Guard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://pbs.twimg.com/media/GlUVXk7XoAA_fbl?format=jpg&name=small">
    <style>
        /* ===== COPY THE FULL ROOT AND GLOBAL STYLES (same as dashboard) ===== */
        :root {
            --bg: #06060e;
            --surface: #0d0d20;
            --card: #161630;
            --border: rgba(255, 255, 255, 0.08);
            --text: #e0e0f0;
            --text-light: #9999bb;
            --accent: #9b7cfc;
            --accent2: #00e5ff;
            --pink: #ff5e9c;
            --radius: 18px;
            --shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            --glass: rgba(14, 14, 35, 0.65);
            --gradient: linear-gradient(135deg, var(--accent), var(--accent2));
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 70px 70px;
            z-index: -1;
            animation: gridFade 5s ease-in-out infinite alternate;
        }

        @keyframes gridFade {
            0% {
                opacity: 0.2;
            }

            100% {
                opacity: 0.5;
            }
        }

        h1 {
            font-size: 2.2rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.8rem;
            display: inline-block;
            position: relative;
            margin-bottom: 1.5rem;
        }

        h2:after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 50px;
            height: 3px;
            background: var(--gradient);
            border-radius: 2px;
        }

        /* Header, sidebar, buttons – exactly the same as above */
        header {
            background: rgba(6, 6, 14, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #fff;
            font-weight: 700;
            font-size: 1.3rem;
            text-decoration: none;
        }

        .logo i {
            color: var(--accent2);
            font-size: 2rem;
            filter: drop-shadow(0 0 10px var(--accent2));
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            width: 32px;
            height: 24px;
            cursor: pointer;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--accent);
            margin: 4px 0;
            border-radius: 1px;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-dropdown {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(155, 124, 252, 0.15);
            border-radius: 30px;
            border: 1px solid rgba(155, 124, 252, 0.2);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-width: 180px;
            padding: 0.5rem 0;
            margin-top: 0.5rem;
        }

        .user-dropdown.active .dropdown-menu {
            display: block;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.6rem 1.2rem;
            color: var(--text-light);
            text-decoration: none;
        }

        .dropdown-menu a:hover {
            color: var(--accent2);
            background: rgba(155, 124, 252, 0.05);
        }

        .dashboard-container {
            display: flex;
            gap: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        @media (max-width: 991px) {
            .dashboard-container {
                flex-direction: column;
            }
        }

        .dashboard-sidebar {
            flex: 0 0 var(--sidebar-width);
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            height: fit-content;
        }

        @media (max-width: 991px) {
            /* same mobile styles as before */
        }

        .dashboard-nav ul {
            list-style: none;
        }

        .dashboard-nav ul li {
            margin-bottom: 0.3rem;
        }

        .dashboard-nav ul li a {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            color: var(--text-light);
            text-decoration: none;
            border-left: 3px solid transparent;
        }

        .dashboard-nav ul li.active a,
        .dashboard-nav ul li a:hover {
            background: rgba(155, 124, 252, 0.1);
            color: #fff;
            border-left-color: var(--accent2);
        }

        .dashboard-main {
            flex: 1;
            min-width: 0;
        }

        .section {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: 0.3s;
        }

        .status-card:hover {
            border-color: var(--accent2);
            transform: translateY(-3px);
        }

        .status-card i {
            font-size: 2rem;
            color: var(--accent2);
            margin-bottom: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 15px rgba(155, 124, 252, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.3);
        }

        .dashboard-footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 1.5rem 0;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <script> if (!sessionStorage.getItem('tevex_logged_in')) window.location.href = 'login.html'; </script>
    <header> ... header identical to dashboard ... </header>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="dashboard-container">
        <aside class="dashboard-sidebar" id="dashboardSidebar">
            <nav class="dashboard-nav">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-vault"></i> My Vault</a></li>
                    <li><a href="access-history.html"><i class="fas fa-history"></i> Access History</a></li>
                    <li class="active"><a href="security-report.html"><i class="fas fa-file-alt"></i> Security
                            Report</a></li>
                    <li><a href="account-settings.html"><i class="fas fa-user-cog"></i> Account Settings</a></li>
                    <li><a href="support.html"><i class="fas fa-headset"></i> Support</a></li>
                </ul>
            </nav>
        </aside>
        <main class="dashboard-main">
            <h1>Security Report</h1>
            <section class="section">
                <h2>System Status</h2>
                <div
                    style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:1.5rem; margin-top:1rem;">
                    <div class="status-card">
                        <i class="fas fa-door-closed"></i>
                        <h3>Vault Door</h3>
                        <p style="color:#10b981;">Secured</p>
                    </div>
                    <div class="status-card">
                        <i class="fas fa-video"></i>
                        <h3>Cameras</h3>
                        <p style="color:#10b981;">Active (12)</p>
                    </div>
                    <div class="status-card">
                        <i class="fas fa-running"></i>
                        <h3>Motion Detection</h3>
                        <p style="color:#10b981;">Online</p>
                    </div>
                    <div class="status-card">
                        <i class="fas fa-bell"></i>
                        <h3>Alarm</h3>
                        <p style="color:#10b981;">Armed</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <footer class="dashboard-footer">
        <p>&copy; 2025 Tevex Prime Guard Security.</p>
    </footer>
    <script>
        // same mobile menu, dropdown, logout (copy from dashboard)
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('dashboardSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        menuToggle.addEventListener('click', () => { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
        document.getElementById('userDropdown').addEventListener('click', function (e) { this.classList.toggle('active'); e.stopPropagation(); });
        document.addEventListener('click', () => document.getElementById('userDropdown').classList.remove('active'));
        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); sessionStorage.clear(); window.location.href = 'login.html'; });
        const user = sessionStorage.getItem('tevex_user_name') || 'User';
        document.getElementById('userAvatar').textContent = user.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        document.getElementById('userDropdownName').textContent = user;
    </script>
</body>

</html>
